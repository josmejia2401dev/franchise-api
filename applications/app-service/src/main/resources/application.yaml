server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: "FranchiseApi"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  data:
    mongodb:
      uri: ${MONGODB_URI}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
resilience:
  mongo:
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      wait-duration-seconds: 5
    time-limiter:
      timeout-seconds: 3
    retry:
      max-attempts: 3
      wait-duration-millis: 200
